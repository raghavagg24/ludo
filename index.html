```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>LUDO</h1>

    <div class="ludo-board">

        <!-- Red Home -->
        <div class="home red-home">
            <div class="inner">
                <div class="token red"></div>
                <div class="token red"></div>
                <div class="token red"></div>
                <div class="token red"></div>
            </div>
        </div>

        <!-- Green Home -->
        <div class="home green-home">
            <div class="inner">
                <div class="token green"></div>
                <div class="token green"></div>
                <div class="token green"></div>
                <div class="token green"></div>
            </div>
        </div>

        <!-- Yellow Home -->
        <div class="home yellow-home">
            <div class="inner">
                <div class="token yellow"></div>
                <div class="token yellow"></div>
                <div class="token yellow"></div>
                <div class="token yellow"></div>
            </div>
        </div>

        <!-- Blue Home -->
        <div class="home blue-home">
            <div class="inner">
                <div class="token blue"></div>
                <div class="token blue"></div>
                <div class="token blue"></div>
                <div class="token blue"></div>
            </div>
        </div>


        <!-- Paths -->

        <div class="path red-path"></div>
        <div class="path green-path"></div>
        <div class="path yellow-path"></div>
        <div class="path blue-path"></div>


        <!-- Center -->
        <div class="center">

            <div class="center-red"></div>
            <div class="center-green"></div>
            <div class="center-yellow"></div>
            <div class="center-blue"></div>

        </div>

        <!-- Dice -->
        <div class="dice">🎲</div>

    </div>

</body>
</html>
